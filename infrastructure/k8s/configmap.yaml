apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-config
  namespace: ai-gateway
data:
  PROJECT_NAME: "AI Model Gateway (Kubernetes)"
  VERSION: "1.0.0"
  STORE_REQUEST_CONTENT: "false"
  DEFAULT_RATE_LIMIT_RPM: "60"
  DEFAULT_MAX_CONCURRENT_REQUESTS: "4"
  # Host endpoints to communicate with native Apple Silicon Metal inference engines
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  MLX_BASE_URL: "http://host.docker.internal:8081"
  LLAMACPP_BASE_URL: "http://host.docker.internal:8082"
  REDIS_URL: "redis://redis-service.ai-gateway.svc.cluster.local:6379/0"

---
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-secret
  namespace: ai-gateway
type: Opaque
stringData:
  SECRET_KEY: "change-this-in-production-secure-min-32-chars-key-12345"
  POSTGRES_PASSWORD: "gateway_secure_password_k8s_123"
  DATABASE_URL: "postgresql+asyncpg://gateway_user:gateway_secure_password_k8s_123@postgres-service.ai-gateway.svc.cluster.local:5432/ai_gateway"
